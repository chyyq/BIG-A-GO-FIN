name: Update A-share recommendations

on:
  workflow_dispatch:
  schedule:
    - cron: "25 1 * * 1-5"
    - cron: "30 1 * * 1-5"
    - cron: "35 1 * * 1-5"
    - cron: "40 1 * * 1-5"
    - cron: "45 1 * * 1-5"
    - cron: "50 1 * * 1-5"
    - cron: "55 1 * * 1-5"
    - cron: "0 2 * * 1-5"
    - cron: "5 2 * * 1-5"
    - cron: "10 2 * * 1-5"
    - cron: "20 7 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate latest recommendations
        run: python scripts/update_data.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/board_history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update daily A-share recommendations"
            git push
          fi
